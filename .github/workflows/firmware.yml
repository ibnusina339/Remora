name: REMORA build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ota:
    uses: ./.github/workflows/ota-regression.yml
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p previews && node tests/ui-smoke.cjs && node tests/power-policy-smoke.cjs && node tests/profiles-smoke.cjs
      - run: g++ -std=gnu++17 -Wall -Wextra -I firmware/esp32c6/components/remora_core/include firmware/esp32c6/components/remora_core/src/*.cpp firmware/esp32c6/tests/core_test.cpp -o /tmp/remora-core && /tmp/remora-core
      - name: Test Wi-Fi lifecycle with controlled driver I/O
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -I tests/network_host/stubs -I firmware/esp32c6/components/remora_core/include \
            tests/network_host/network_test.cpp -pthread -o /tmp/remora-network-test
          /tmp/remora-network-test
      - name: Test audio runtime lifecycle
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I tests/audio_host/stubs tests/audio_host/audio_test.cpp -o /tmp/remora-audio-test
          /tmp/remora-audio-test
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware/esp32c6
          idf.py set-target esp32c6
          idf.py build
          cd build
          python -m esptool --chip esp32c6 merge_bin -o remora-full.bin @flash_args
      - name: Prepare release files
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python tools/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: remora-esp32c6
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: remora-debug
          path: |
            firmware/esp32c6/build/Remora.elf
            firmware/esp32c6/build/Remora.map
            firmware/esp32c6/sdkconfig
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, ota, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: remora-esp32c6
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
